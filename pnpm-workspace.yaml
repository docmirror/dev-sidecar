packages:
  # GUI 与 ds-core（submodule）；不再使用 monorepo 内旧的 core/mitmproxy
  - packages/gui
  - packages/aur
  - vendor/ds-core/packages/*
  - '!**/test/**'

shamefullyHoist: true

# 不要恢复 overrides：cross-spawn / form-data 等会与 electron-builder 生产依赖解析冲突。
# 安全版本请通过升级直接依赖解决。

supportedArchitectures:
  os:
    - current
  cpu:
    - x64
    - arm64
    - ia32

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  electron: true
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true
