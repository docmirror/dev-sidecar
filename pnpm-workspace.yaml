packages:
  # packages/core、packages/mitmproxy 为指向 vendor/ds-core/{core,mitmproxy} 的符号链接
  # ds-core submodule 位于 vendor/ 下（不在 packages/ 内），无需额外排除规则
  - packages/*
  - '!**/test/**'
  # 构建辅助脚本（裸 import 的依赖声明在 _script/package.json，纳入 workspace 统一管理）
  - _script

# 不要恢复 overrides：cross-spawn / form-data 等会与 electron-builder 生产依赖解析冲突。
# 安全版本请通过升级直接依赖解决。

# pnpm 12 默认开启供应链「最短发布年龄」检查（24 小时），新发布的包在冷却期内会让
# `pnpm install` 直接失败。下面这些包属于两种必须豁免的情况：
#   - electron：CVE 修复要求 42.11.16+，只能跟最新补丁版走；
#   - caniuse-lite / electron-to-chromium：浏览器数据包，按天更新且不含可执行代码；
#   - napi-postinstall：随依赖树被动升级的构建脚本辅助包。
minimumReleaseAgeExclude:
  - electron
  - caniuse-lite
  - electron-to-chromium
  - napi-postinstall

# 统一本地与 CI 的 node_modules 布局：pnpm 12 的隔离布局下，electron-builder
# 与 pkg/*.cjs 打包钩子看到的依赖树和 CI 不同（未声明的传递依赖在本地解析不到）。
# 注意 pnpm 12 已不读 .npmrc 里的 node-linker，只认这里的 nodeLinker。
# 首次切换或 node_modules 里残留 .modules.yaml（hoistedLayout=false）时，
# 需要执行一次 `pnpm install --node-linker hoisted` 强制重排。
nodeLinker: hoisted

supportedArchitectures:
  os:
    - current
  cpu:
    - x64
    - arm64
    - ia32

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  electron: true
  electron-winstaller: true
  esbuild: true
  # keytar 7.9.0 是 N-API（ABI 稳定），install 脚本 = prebuild-install（仅下载 N-API 预编译，不需 C++ 编译器），
  # 能在 Electron 41 内嵌的 Node 24 里直接加载。务必允许其 install 脚本运行，否则全新 pnpm install 拿不到二进制 → 回退 file-aes。
  keytar: true
  # koffi 主包的 install 脚本会尝试 CMake 源码编译，本机无 CMake → 必须禁（allowBuilds.koffi=true 会让 pnpm install 退出 1）。
  # 但 koffi 3.3.2 的原生二进制由 @koromix/koffi-win32-x64 等「平台预编译包」提供（纯预编译，无需构建脚本），require('koffi') 实测仍可加载；
  # 且 koffi 仅在 set-system-env.js 的 WM_SETTINGCHANGE 广播一处使用并有 setx 兜底 → 禁用零功能影响。
  koffi: false
  unrs-resolver: true
