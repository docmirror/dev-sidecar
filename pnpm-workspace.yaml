packages:
  # all packages in subdirectories of packages/ and components/
  - packages/*
  # exclude packages that are inside test directories
  - '!**/test/**'

shamefullyHoist: true

# 安全覆盖：强制最低安全版本，避免传递依赖回落到有漏洞的旧版本
overrides:
  axios: '>=1.18.1'
  brace-expansion@<2.0.0: '1.1.11'
  cross-spawn: '>=7.0.5'
  dns-packet: '>=5.6.1'
  form-data: '>=4.0.6'
  hoek: 'npm:@hapi/hoek@>=10.0.0'
  ip: '>=2.0.1'
  minimist: '>=1.2.6'
  qs: '>=6.15.3'
  tough-cookie: '>=4.1.3 <5.0.0'

supportedArchitectures:
  os:
    - current
  cpu:
    - x64
    - arm64
    - ia32

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  electron: true
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true
