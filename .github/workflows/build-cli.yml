name: "Build CLI (SEA)"

on:
  push:
    branches:
      - release*
    tags:
      - 'v*'
    paths:
      - "packages/cli/**"
      - "packages/core/**"
      - "packages/mitmproxy/**"
      - ".github/workflows/build-cli.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup pnpm"
        uses: pnpm/action-setup@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: "Install dependencies"
        run: pnpm install --filter @docmirror/dev-sidecar-cli...

      - name: "Test CLI"
        run: pnpm --filter @docmirror/dev-sidecar-cli test

      - name: "Build all platforms"
        run: node packages/cli/scripts/build.js --all

      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: ds-cli-${{ github.sha }}
          path: |
            packages/cli/dist/ds-cli-*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: "Download artifacts"
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: "Flatten artifacts"
        run: |
          mv release/ds-cli-*/* release/ 2>/dev/null || true
          rm -rf release/ds-cli-*
          chmod +x release/ds-cli-*
          ls -lah release/

      - name: "Create release"
        uses: wangliang181230/github-action-ghr@master
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GHR_PATH: release/
          GHR_TITLE: ${{ github.ref_name }}
          GHR_REPLACE: true
          GHR_DRAFT: true
